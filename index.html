// Upgrades older saved payloads to the current shape. Add a new "if (data.dataVersion < N)"
// block here whenever a future change alters how data is stored, so nobody's history is lost.
function migrateData(raw) {
  let data = raw;
  if (!data || typeof data !== "object" || Array.isArray(data)) {
    // Oldest format: the bare { "Book::Chapter": [...] } map with no version wrapper at all.
    data = { dataVersion: 0, readings: raw && typeof raw === "object" ? raw : {} };
  }
  if (typeof data.dataVersion !== "number") data.dataVersion = 0;

  // v0/v1 (pre-profiles): a single flat `readings` map — wrap it into one profile
  // so nobody's existing history disappears when profiles are introduced.
  if (data.dataVersion < 2) {
    const legacyReadings = data.readings || {};
    const hasLegacyData = Object.keys(legacyReadings).length > 0;
    const id = "legacy";
    data = {
      dataVersion: 2,
      profiles: hasLegacyData ? [{ id, name: "My Reading", color: PROFILE_COLORS[0] }] : [],
      profileData: hasLegacyData ? { [id]: { readings: legacyReadings } } : {},
    };
  }

  const profiles = Array.isArray(data.profiles) ? data.profiles : [];
  const profileData = data.profileData && typeof data.profileData === "object" ? { ...data.profileData } : {};
  // v2 -> v3: each profile also gets a `notes` map for remembered verses.
  profiles.forEach((p) => {
    if (!profileData[p.id]) profileData[p.id] = { readings: {}, notes: {} };
    if (!profileData[p.id].notes) profileData[p.id].notes = {};
  });
  return { dataVersion: DATA_VERSION, profiles, profileData };
}

function loadAppData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { profiles: [], profileData: {} };
    return migrateData(JSON.parse(raw));
  } catch (e) {
    return { profiles: [], profileData: {} };
  }
}

function saveAppData(profiles, profileData) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ dataVersion: DATA_VERSION, profiles, profileData }));
    return true;
  } catch (e) {
    return false;
  }
}

// --- API.Bible (NKJV verse lookup) ---
// The key lives in its own localStorage entry, separate from the reading
// data, so it's never swept into an exported/imported backup file.
function getApiBibleKey() {
  try { return localStorage.getItem(APIBIBLE_KEY_STORAGE) || ""; } catch (e) { return ""; }
}
function setApiBibleKey(key) {
  try { localStorage.setItem(APIBIBLE_KEY_STORAGE, key); return true; } catch (e) { return false; }
}
function getCachedNkjvId() {
  try { return localStorage.getItem(APIBIBLE_ID_STORAGE) || ""; } catch (e) { return ""; }
}
function setCachedNkjvId(id) {
  try { localStorage.setItem(APIBIBLE_ID_STORAGE, id); } catch (e) { /* ignore */ }
}

async function resolveNkjvBibleId(apiKey) {
  const cached = getCachedNkjvId();
  if (cached) return cached;
  const res = await fetch("https://api.scripture.api.bible/v1/bibles?language=eng", { headers: { "api-key": apiKey } });
  if (!res.ok) throw new Error(res.status === 401 ? "invalid-key" : "network");
  const json = await res.json();
  const match = (json.data || []).find((b) => (b.abbreviation || "").toUpperCase() === "NKJV")
    || (json.data || []).find((b) => (b.name || "").toUpperCase().includes("NEW KING JAMES"));
  if (!match) throw new Error("no-nkjv");
  setCachedNkjvId(match.id);
  return match.id;
}

// Step 1: verse references only, no text — keeps the picker from revealing
// anything until a specific verse is chosen.
async function fetchChapterVerseRefs(bibleId, apiKey, usfmBook, chapter) {
  const chapterId = `${usfmBook}.${chapter}`;
  const res = await fetch(`https://api.scripture.api.bible/v1/bibles/${bibleId}/chapters/${chapterId}/verses`, { headers: { "api-key": apiKey } });
  if (!res.ok) throw new Error(res.status === 401 ? "invalid-key" : "network");
  const json = await res.json();
  return (json.data || []).map((v, i) => ({ id: v.id, number: i + 1 }));
}

// Step 2: the actual text — only called once a verse number is picked.
async function fetchVerseText(bibleId, apiKey, verseId) {
  const url = `https://api.scripture.api.bible/v1/bibles/${bibleId}/verses/${verseId}?content-type=text&include-verse-numbers=false&include-chapter-numbers=false&include-notes=false`;
  const res = await fetch(url, { headers: { "api-key": apiKey } });
  if (!res.ok) throw new Error(res.status === 401 ? "invalid-key" : "network");
  const json = await res.json();
  return (json.data && json.data.content ? json.data.content : "").trim();
}

  const [historyMetric, setHistoryMetric] = useState("books"); // "chapters" | "books"

  useEffect(() => {

    setProfileData(data.profileData);
    setActiveProfileId(null); // always land on the profile picker on a fresh load
    setApiKeyValue(getApiBibleKey());
    setLoaded(true);
  }, []);

  const saveApiKey = (key) => {
    setApiKeyValue(key);
    setApiBibleKey(key);
  };

  const persist = useCallback((nextProfiles, nextProfileData) => {
    setSaveState("saving");
    const ok = saveAppData(nextProfiles, nextProfileData);
    setSaveState(ok ? "idle" : "error");
  }, []);

  const addProfile = (name) => {
    const id = makeId();
    setProfiles((prev) => {
      const nextProfiles = [...prev, { id, name, color: PROFILE_COLORS[prev.length % PROFILE_COLORS.length] }];
      setProfileData((prevData) => {
        const nextData = { ...prevData, [id]: { readings: {}, notes: {} } };
        persist(nextProfiles, nextData);
        return nextData;
      });
      return nextProfiles;
    });
    return id;
  };

  const renameProfile = (id, name) => {
    setProfiles((prev) => {
      const nextProfiles = prev.map((p) => (p.id === id ? { ...p, name } : p));
      persist(nextProfiles, profileData);
      return nextProfiles;
    });
  };

  const deleteProfile = (id) => {
    setProfiles((prev) => {
      const nextProfiles = prev.filter((p) => p.id !== id);
      setProfileData((prevData) => {
        const nextData = { ...prevData };
        delete nextData[id];
        persist(nextProfiles, nextData);
        return nextData;
      });
      return nextProfiles;
    });
    setActiveProfileId((prev) => (prev === id ? null : prev));
  };

  const selectProfile = (id) => setActiveProfileId(id);
  const switchProfile = () => { setActiveProfileId(null); setActiveTab("books"); setBooksView("testaments"); setSelected(null); setExpandedStat(null); };

  const exportData = () => {
    const payload = JSON.stringify({ dataVersion: DATA_VERSION, profiles, profileData, exportedAt: new Date().toISOString() }, null, 2);
    const blob = new Blob([payload], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `lectio-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importInputRef = React.useRef(null);
  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const imported = migrateData(parsed);
        setProfiles(imported.profiles);
        setProfileData(imported.profileData);
        setActiveProfileId(null);
        persist(imported.profiles, imported.profileData);
        setSaveState("idle");
      } catch (err) {
        window.alert("That file couldn't be read — make sure it's a Lectio backup .json file.");
      }
    };
    reader.readAsText(file);
  };


  const keyFor = (book, chapter) => `${book}::${chapter}`;

  const updateReadings = (updater) => {
    if (!activeProfileId) return;
    setProfileData((prev) => {
      const currentProfile = prev[activeProfileId] || { readings: {}, notes: {} };
      const nextReadings = updater(currentProfile.readings || {});
      const next = { ...prev, [activeProfileId]: { ...currentProfile, readings: nextReadings } };
      persist(profiles, next);
      return next;
    });
  };

  const updateNotes = (updater) => {
    if (!activeProfileId) return;
    setProfileData((prev) => {
      const currentProfile = prev[activeProfileId] || { readings: {}, notes: {} };
      const nextNotes = updater(currentProfile.notes || {});
      const next = { ...prev, [activeProfileId]: { ...currentProfile, notes: nextNotes } };
      persist(profiles, next);
      return next;
    });
  };

  const noteKeyFor = (book, chapter, verse) => `${book}::${chapter}::${verse}`;

  const saveNote = (book, chapter, verse, text, reference) => {
    updateNotes((prev) => ({ ...prev, [noteKeyFor(book, chapter, verse)]: { text, reference, savedAt: todayStr() } }));
  };

  const deleteNote = (book, chapter, verse) => {
    updateNotes((prev) => {
      const next = { ...prev };
      delete next[noteKeyFor(book, chapter, verse)];
      return next;
    });
  };

  const addReading = (book, chapter, date) => {
    updateReadings((prev) => {
      const k = keyFor(book, chapter);
      const entries = prev[k] ? [...prev[k]] : [];
      entries.push({ id: makeId(), date });
      return { ...prev, [k]: entries };
    });
  };

  const updateEntryDate = (book, chapter, id, date) => {
    updateReadings((prev) => {
      const k = keyFor(book, chapter);
      const entries = (prev[k] || []).map((e) => (e.id === id ? { ...e, date } : e));
      return { ...prev, [k]: entries };
    });
  };

  const removeEntry = (book, chapter, id) => {
    updateReadings((prev) => {
      const k = keyFor(book, chapter);
      const entries = (prev[k] || []).filter((e) => e.id !== id);
      const next = { ...prev };
      if (entries.length) next[k] = entries; else delete next[k];
      return next;
    });
  };

  const clearAllEntries = (book, chapter) => {
    updateReadings((prev) => {
      const next = { ...prev };
      delete next[keyFor(book, chapter)];
      return next;
    });
  };

  const handleCellClick = (book, chapter) => setSelected({ book, chapter });

  const openBook = (book) => {
    setBooksTestament(book.testament);
    setBooksSelectedBook(book.name);
    setBooksView("chapters");
    setSelected(null);
  };

  const goToChapter = (book, chapter) => {
    setActiveTab("books");
    openBook(BOOK_BY_NAME[book]);
    setSelected({ book, chapter });
  };

  // ------------------------------ base derived data ------------------------------
  const chapterKeys = Object.keys(readings).filter((k) => readings[k] && readings[k].length);
  const bookProgress = useMemo(() => {
    const map = {};
    BOOKS.forEach((b) => (map[b.name] = 0));
    chapterKeys.forEach((k) => {
      const book = k.split("::")[0];
      map[book] = (map[book] || 0) + 1;
    });
    return map;
  }, [readings]);

  const bookTotalReadings = useMemo(() => {
    const map = {};
    BOOKS.forEach((b) => (map[b.name] = 0));
    Object.entries(readings).forEach(([k, entries]) => {
      const book = k.split("::")[0];
      map[book] = (map[book] || 0) + entries.length;
    });
    return map;
  }, [readings]);

  // Book "completions" — how many times a book has been read cover to cover.
  // This is the minimum number of entries across every chapter in the book
  // (0 if any chapter is still unread), so a re-read only counts once the
  // WHOLE book has been read again — never a single chapter on its own.
  const bookCompletions = useMemo(() => {
    const map = {};
    BOOKS.forEach((b) => {
      let min = Infinity;
      for (let c = 1; c <= b.chapters; c++) {
        const entries = readings[keyFor(b.name, c)];
        const n = entries ? entries.length : 0;
        if (n < min) min = n;
        if (min === 0) break;
      }
      map[b.name] = min === Infinity ? 0 : min;
    });
    return map;
  }, [readings]);

  const firstReadDate = useMemo(() => {
    const map = {};
    Object.entries(readings).forEach(([k, entries]) => {
      if (!entries.length) return;
      map[k] = entries.reduce((min, e) => (e.date < min ? e.date : min), entries[0].date);
    });
    return map;
  }, [readings]);

  const booksCompleted = BOOKS.filter((b) => bookProgress[b.name] >= b.chapters).length;

  const versesReadEstimate = useMemo(
    () => BOOKS.reduce((s, b) => s + Math.round(((bookProgress[b.name] || 0) / b.chapters) * (BOOK_VERSES[b.name] || 0)), 0),
    [bookProgress]
  );

  const testamentProgress = useMemo(() => {
    return TESTAMENTS.map((tst) => {
      const booksIn = BOOKS.filter((b) => b.testament === tst.key);
      const total = booksIn.reduce((s, b) => s + b.chapters, 0);
      const read = booksIn.reduce((s, b) => s + (bookProgress[b.name] || 0), 0);
      const totalReads = booksIn.reduce((s, b) => s + (bookTotalReadings[b.name] || 0), 0);
      const bookPasses = booksIn.reduce((s, b) => s + (bookCompletions[b.name] || 0), 0);
      const booksDoneOnce = booksIn.filter((b) => (bookCompletions[b.name] || 0) >= 1).length;
      return { ...tst, label: testamentLabel(tst.key), total, read, pct: total ? Math.round((read / total) * 100) : 0, totalReads, bookPasses, booksDoneOnce };
    });
  }, [bookProgress, bookTotalReadings, bookCompletions, lang]);

  // Quick lookup maps for the "N book(s) re-read" labels at the testament level —
  // sourced from whole-book completions, not chapter-level entry counts.
  const testamentReadCounts = useMemo(() => {
    const map = {};
    testamentProgress.forEach((t) => { map[t.key] = t.bookPasses; });
    return map;
  }, [testamentProgress]);
  const testamentChapterCounts = useMemo(() => {
    const map = {};
    testamentProgress.forEach((t) => { map[t.key] = t.booksDoneOnce; });
    return map;
  }, [testamentProgress]);

  // Most re-read books — a book only appears once it's been completed
  // cover-to-cover more than once, not from individual chapter re-reads.
  const topRereadBooks = useMemo(() => {
    return BOOKS
      .map((b) => ({ name: b.name, completions: bookCompletions[b.name] || 0 }))
      .filter((b) => b.completions > 1)
      .sort((a, b) => b.completions - a.completions)
      .slice(0, 5);
  }, [bookCompletions]);

  // ------------------------------ dashboard scope (filter-aware) ------------------------------
  const scopeBooks = useMemo(
    () => (filterTestament === "all" ? BOOKS : BOOKS.filter((b) => b.testament === filterTestament)),
    [filterTestament]
  );
  const scopeTotal = scopeBooks.reduce((s, b) => s + b.chapters, 0);
  const scopeRead = scopeBooks.reduce((s, b) => s + (bookProgress[b.name] || 0), 0);
  const scopePct = scopeTotal ? Math.round((scopeRead / scopeTotal) * 1000) / 10 : 0;
  const scopeBooksCompleted = scopeBooks.filter((b) => bookProgress[b.name] >= b.chapters).length;
  const scopeVerses = scopeBooks.reduce((s, b) => s + Math.round(((bookProgress[b.name] || 0) / b.chapters) * (BOOK_VERSES[b.name] || 0)), 0);
  const scopeVersesTotal = scopeBooks.reduce((s, b) => s + (BOOK_VERSES[b.name] || 0), 0);

  // ------------------------------ stat-card drill-down data ------------------------------
  const chaptersReadDetail = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    const map = {};
    chapterKeys.forEach((k) => {
      const [book, chapter] = k.split("::");
      if (!scopeNames.has(book)) return;
      if (!map[book]) map[book] = [];
      map[book].push(Number(chapter));
    });
    Object.values(map).forEach((arr) => arr.sort((a, b) => a - b));
    return BOOKS.filter((b) => map[b.name]).map((b) => ({ book: b.name, chapters: map[b.name] }));
  }, [chapterKeys, scopeBooks]);

  const booksCompletedDetail = useMemo(
    () => scopeBooks.filter((b) => (bookProgress[b.name] || 0) >= b.chapters),
    [scopeBooks, bookProgress]
  );
  const booksInProgressDetail = useMemo(
    () => scopeBooks
      .map((b) => ({ name: b.name, read: bookProgress[b.name] || 0, total: b.chapters }))
      .filter((b) => b.read > 0 && b.read < b.total)
      .sort((a, b) => (b.read / b.total) - (a.read / a.total))
      .slice(0, 8),
    [scopeBooks, bookProgress]
  );

  // Books currently being read (started, not yet finished) across the whole
  // canon — used for the "Current reading" shelf at the top of the Books tab.
  // Ordered by most recent activity so whatever you last picked up sits first.
  const currentlyReadingBooks = useMemo(() => {
    return BOOKS
      .map((b) => {
        const read = bookProgress[b.name] || 0;
        if (read <= 0 || read >= b.chapters) return null;
        let lastDate = "";
        for (let c = 1; c <= b.chapters; c++) {
          const entries = readings[keyFor(b.name, c)];
          if (!entries) continue;
          entries.forEach((e) => { if (e.date > lastDate) lastDate = e.date; });
        }
        return { book: b, read, lastDate };
      })
      .filter(Boolean)
      .sort((a, b) => (b.lastDate > a.lastDate ? 1 : b.lastDate < a.lastDate ? -1 : 0));
  }, [bookProgress, readings]);

  const versesDetail = useMemo(
    () => scopeBooks
      .map((b) => {
        const read = bookProgress[b.name] || 0;
        const est = Math.round((read / b.chapters) * (BOOK_VERSES[b.name] || 0));
        return { name: b.name, est, total: BOOK_VERSES[b.name] || 0 };
      })
      .filter((x) => x.est > 0)
      .sort((a, b) => b.est - a.est),
    [scopeBooks, bookProgress]
  );

  // Books read more than once, scoped to the current testament filter —
  // and whether a whole testament has ever been fully re-read (every book
  // in it completed cover-to-cover at least twice).
  const rereadBooksDetail = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    return BOOKS
      .filter((b) => scopeNames.has(b.name) && (bookCompletions[b.name] || 0) >= 2)
      .map((b) => ({ name: b.name, completions: bookCompletions[b.name] || 0 }))
      .sort((a, b) => b.completions - a.completions);
  }, [scopeBooks, bookCompletions]);

  const testamentFullyReread = useMemo(() => {
    const map = {};
    TESTAMENTS.forEach((t) => {
      const booksIn = BOOKS.filter((b) => b.testament === t.key);
      map[t.key] = booksIn.every((b) => (bookCompletions[b.name] || 0) >= 2);
    });
    return map;
  }, [bookCompletions]);
  const scopedRereadAchievements = useMemo(
    () => (filterTestament === "all" ? TESTAMENTS : TESTAMENTS.filter((t) => t.key === filterTestament)).filter((t) => testamentFullyReread[t.key]),
    [filterTestament, testamentFullyReread]
  );

  const scopeEventDates = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    const out = [];
    Object.entries(readings).forEach(([k, entries]) => {
      const book = k.split("::")[0];
      if (scopeNames.has(book)) entries.forEach((e) => out.push(e.date));
    });
    return out;
  }, [readings, scopeBooks]);

  const { currentStreak, longestStreak, currentStreakRange, longestStreakRange } = useMemo(() => {
    const dates = [...new Set(scopeEventDates)].sort();
    if (!dates.length) return { currentStreak: 0, longestStreak: 0, currentStreakRange: null, longestStreakRange: null };
    let best = 1, cur = 1, curStart = dates[0], bestStart = dates[0], bestEnd = dates[0];
    for (let i = 1; i < dates.length; i++) {
      const prev = new Date(dates[i - 1] + "T00:00:00");
      const curD = new Date(dates[i] + "T00:00:00");
      const diff = Math.round((curD - prev) / DAY_MS);
      if (diff === 1) { cur += 1; } else { cur = 1; curStart = dates[i]; }
      if (cur > best) { best = cur; bestStart = curStart; bestEnd = dates[i]; }
    }
    const last = new Date(dates[dates.length - 1] + "T00:00:00");
    const today = new Date(todayStr() + "T00:00:00");
    const gap = Math.round((today - last) / DAY_MS);
    const isActive = gap <= 1;
    return {
      currentStreak: isActive ? cur : 0,
      longestStreak: best,
      currentStreakRange: isActive ? { start: curStart, end: dates[dates.length - 1] } : null,
      longestStreakRange: { start: bestStart, end: bestEnd },
    };
  }, [scopeEventDates]);

  // How many chapters were read (for the first time) or books were finished,
  // bucketed by month or year — for the "Reading history" chart.
  const bookCompletionDate = useMemo(() => {
    const map = {};
    BOOKS.forEach((b) => {
      if ((bookProgress[b.name] || 0) < b.chapters) return; // not finished yet
      let max = null;
      for (let c = 1; c <= b.chapters; c++) {
        const d = firstReadDate[keyFor(b.name, c)];
        if (!d) { max = null; break; }
        if (!max || d > max) max = d;
      }
      if (max) map[b.name] = max;
    });
    return map;
  }, [bookProgress, firstReadDate]);

  const periodKey = (isoDate, granularity) => (granularity === "year" ? isoDate.slice(0, 4) : isoDate.slice(0, 7));
  const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const periodLabel = (key, granularity) => {
    if (granularity === "year") return key;
    const [y, m] = key.split("-");
    return `${MONTH_NAMES[Number(m) - 1]} '${y.slice(2)}`;
  };

  const historyData = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    const counts = {};
    if (historyMetric === "chapters") {
      Object.entries(firstReadDate).forEach(([k, d]) => {
        const book = k.split("::")[0];
        if (!scopeNames.has(book)) return;
        const pk = periodKey(d, historyGranularity);
        counts[pk] = (counts[pk] || 0) + 1;
      });
    } else {
      Object.entries(bookCompletionDate).forEach(([book, d]) => {
        if (!scopeNames.has(book)) return;
        const pk = periodKey(d, historyGranularity);
        counts[pk] = (counts[pk] || 0) + 1;
      });
    }
    return Object.keys(counts).sort().map((k) => ({ period: k, label: periodLabel(k, historyGranularity), count: counts[k] }));
  }, [firstReadDate, bookCompletionDate, scopeBooks, historyMetric, historyGranularity]);

  // Which specific books finished in each period — shown on hover instead of
  // a redundant month+count (both already visible on the axis / chips).
  const historyBooksByPeriod = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    const map = {};
    Object.entries(bookCompletionDate).forEach(([book, d]) => {
      if (!scopeNames.has(book)) return;
      const pk = periodKey(d, historyGranularity);
      if (!map[pk]) map[pk] = [];
      map[pk].push(book);
    });
    Object.values(map).forEach((arr) => arr.sort());
    return map;
  }, [bookCompletionDate, scopeBooks, historyGranularity]);

  const HistoryTooltip = ({ active, payload }) => {
    if (!active || !payload || !payload.length) return null;
    const period = payload[0].payload.period;
    if (historyMetric === "books") {
      const names = historyBooksByPeriod[period] || [];
      return (
        <div style={{ background: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}`, borderRadius: 8, padding: "8px 10px", fontSize: 12, maxWidth: 220 }}>
          {names.length ? names.map((n) => <div key={n} style={{ color: PALETTE.ink }}>{bookLabel(n)}</div>) : <div style={{ color: PALETTE.ink }}>{t("No books finished", "لم يكتمل أي سفر")}</div>}
        </div>
      );
    }
    return (
      <div style={{ background: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}`, borderRadius: 8, padding: "8px 10px", fontSize: 12 }}>
        <div style={{ color: PALETTE.ink }}>{t(`${payload[0].value} chapter${payload[0].value === 1 ? "" : "s"} read`, `${payload[0].value} إصحاحًا مقروءًا`)}</div>
      </div>
    );
  };

  const recent = useMemo(() => {
    const scopeNames = new Set(scopeBooks.map((b) => b.name));
    const flat = [];
    Object.entries(readings).forEach(([k, entries]) => {
      const [book, chapter] = k.split("::");
      if (!scopeNames.has(book)) return;
      entries.forEach((e) => flat.push({ book, chapter: Number(chapter), date: e.date, timesRead: entries.length }));
    });
    return flat.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)).slice(0, 6);
  }, [readings, scopeBooks]);

  const paceInfo = useMemo(() => {
    const remaining = scopeTotal - scopeRead;
    if (scopeRead === 0) return { status: "none" };
    if (remaining <= 0) return { status: "done" };
    const dates = scopeBooks
      .flatMap((b) => Array.from({ length: b.chapters }, (_, i) => firstReadDate[keyFor(b.name, i + 1)]))
      .filter(Boolean)
      .sort();
    const firstDate = new Date(dates[0] + "T00:00:00");
    const today = new Date(todayStr() + "T00:00:00");
    const daysSinceStart = Math.max(1, Math.round((today - firstDate) / DAY_MS) + 1);
    const lifetimePace = scopeRead / daysSinceStart;
    const cutoff30 = new Date(today.getTime() - 30 * DAY_MS);
    const recentCount = dates.filter((d) => new Date(d + "T00:00:00") >= cutoff30).length;
    const recentPace = recentCount / 30;
    const pace = recentPace > 0 ? recentPace : lifetimePace;
    if (pace <= 0) return { status: "stalled" };
    const estimatedDays = Math.ceil(remaining / pace);
    const completionDate = new Date(today.getTime() + estimatedDays * DAY_MS);
    return {
      status: "ok", remaining, paceWeekly: Math.round(pace * 7 * 10) / 10, estimatedDays,
      completionDate: completionDate.toISOString().slice(0, 10),
    };
  }, [scopeBooks, scopeTotal, scopeRead, firstReadDate, readings]);

  const longestStreakEver = useMemo(() => {
    const dates = [...new Set(Object.values(readings).flat().map((e) => e.date))].sort();
    if (!dates.length) return 0;
    let best = 1, cur = 1;
    for (let i = 1; i < dates.length; i++) {
      const diff = Math.round((new Date(dates[i] + "T00:00:00") - new Date(dates[i - 1] + "T00:00:00")) / DAY_MS);
      cur = diff === 1 ? cur + 1 : 1;
      best = Math.max(best, cur);
    }
    return best;
  }, [readings]);

  const sortedBookCompletionDates = useMemo(() => Object.values(bookCompletionDate).slice().sort(), [bookCompletionDate]);

  const milestones = useMemo(() => {
    const bookMs = BOOK_MILESTONES.map((n) => ({
      id: `bk-${n}`, label: n === TOTAL_BOOKS ? t("Full Canon", "الكتاب المقدس كاملاً") : t(`${n} Book${n === 1 ? "" : "s"}`, `${n} سفرًا`),
      achieved: booksCompleted >= n, date: booksCompleted >= n ? sortedBookCompletionDates[n - 1] : null,
      icon: n === TOTAL_BOOKS ? Award : Library,
    }));
    const streakMs = STREAK_MILESTONES.map((n) => ({
      id: `st-${n}`, label: t(`${n}-Day Streak`, `سلسلة ${n} يومًا`), achieved: longestStreakEver >= n, date: null, icon: Flame,
    }));
    const otBooks = BOOKS.filter((b) => b.testament === "ot");
    const ntBooks = BOOKS.filter((b) => b.testament === "nt");
    const specialMs = [
      { id: "ot-complete", label: t("Old Testament Complete", "اكتمل العهد القديم"), achieved: otBooks.every((b) => bookProgress[b.name] >= b.chapters), date: null, icon: Award },
      { id: "nt-complete", label: t("New Testament Complete", "اكتمل العهد الجديد"), achieved: ntBooks.every((b) => bookProgress[b.name] >= b.chapters), date: null, icon: Award },
    ];
    return [...bookMs, ...specialMs, ...streakMs];
  }, [booksCompleted, sortedBookCompletionDates, longestStreakEver, bookProgress, lang]);

  const nextMilestone = milestones.find((m) => !m.achieved);

  // ------------------------------ UI atoms ------------------------------
  const fontImport = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;500;600;700&display=swap');
      .lectio-root { font-family: 'Inter', sans-serif; }
      .lectio-display { font-family: 'Cormorant Garamond', serif; }
      .lectio-ar { font-family: 'Cairo', sans-serif; }
      .lectio-ar .lectio-display { font-family: 'Amiri', serif; }
      .lectio-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
      .lectio-scroll::-webkit-scrollbar-thumb { background: ${PALETTE.goldSoft}; border-radius: 4px; }
      .lectio-fade-in { animation: lectio-fadein .25s ease; }
      @keyframes lectio-fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
      .lectio-pill { cursor: pointer; transition: background .15s ease, color .15s ease; }
      .lectio-card { box-shadow: 0 6px 18px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.03); }
      @keyframes lectio-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(217,130,43,0.55);} 50% { box-shadow: 0 0 0 4px rgba(217,130,43,0);} }
      .lectio-reread-badge { animation: lectio-glow 2.2s ease-in-out infinite; }
      .lectio-cell { transition: transform .12s ease, box-shadow .12s ease; }
      .lectio-cell:hover { transform: translateY(-1px) scale(1.06); }
      .lectio-tile:hover { transform: translateY(-2px); }
      .lectio-tile { transition: transform .15s ease; }
      .lectio-ar input[type="date"] { direction: ltr; text-align: right; }
    `}</style>
  );

  const Ring = ({ pct, size = 108 }) => {
    const stroke = 9;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    return (
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={PALETTE.gold} />
            <stop offset="100%" stopColor="#E8C766" />
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={PALETTE.wood} strokeWidth={stroke} fill="none" />
        <circle
          cx={size / 2} cy={size / 2} r={r}
          stroke="url(#ringGrad)" strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={c - (Math.min(100, pct) / 100) * c}
          strokeLinecap="round"
          style={{ transition: "stroke-dashoffset .6s ease" }}
        />
      </svg>
    );
  };

  const PillGroup = ({ value, onChange, options }) => (
    <div className="flex rounded-full overflow-hidden" style={{ border: `1px solid ${PALETTE.wood}` }}>
      {options.map((o) => (
        <button
          key={o.value}
          onClick={() => onChange(o.value)}
          className="lectio-pill px-3 py-1 text-xs"

  const MilestoneStrip = () => (

      {paceInfo.status === "done" && (
        <p className="text-sm lectio-display text-lg" style={{ color: PALETTE.gold }}>
          {filterTestament === "all" ? t("The entire canon", "الكتاب المقدس بأكمله") : testamentLabel(filterTestament)} — {t("complete. 🎉", "اكتمل. 🎉")}

                  <Award size={13} /> {t(`${tst.label} fully re-read`, `${testamentLabel(tst.key)} — أُعيدت قراءته بالكامل`)}
                </span>
              ))}
            </div>
          )}
          {rereadBooksDetail.length ? (
            <div className="space-y-1.5">
              {rereadBooksDetail.map((b) => (
                <button key={b.name} onClick={() => { setActiveTab("books"); openBook(BOOK_BY_NAME[b.name]); }} className="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-sm" style={{ background: PALETTE.bgSoft2, color: PALETTE.parchment }}>
                  <span>{bookLabel(b.name)}</span>

            <p className="text-sm" style={{ color: PALETTE.muted }}>{t("No book has been read more than once yet — finish a book a second time to see it here.", "لم يُقرأ أي سفر أكثر من مرة بعد — أنهِ سفرًا للمرة الثانية ليظهر هنا.")}</p>

            </p>
            <div className="space-y-1.5">
              {ascEntries.map((e, i) => (
                <div key={e.id} className="flex items-center gap-2">
                  <span className="text-[10px] w-7 flex-shrink-0" style={{ color: PALETTE.inkSoft }}>{ordinal(i + 1)}</span>
                  <Calendar size={13} color={PALETTE.inkSoft} />
                  <input
                    type="date" value={e.date} max={todayStr()}
                    onChange={(ev) => updateEntryDate(book, chapter, e.id, ev.target.value)}
                    className="text-sm rounded-md px-2 py-1 outline-none"
                    style={{ background: "#fff", border: `1px solid ${PALETTE.inkSoft}`, color: PALETTE.ink }}
                  />
                  <button onClick={() => removeEntry(book, chapter, e.id)} title={t("Delete this reading", "حذف هذه القراءة")} className="rounded-md p-1.5" style={{ background: PALETTE.burgundy, color: PALETTE.parchment }}>
                    <Trash2 size={13} />
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        <VerseNotes book={book} chapter={chapter} />
      </div>
    );
  };

  // Verse-remembering picker: shows a 1..N dropdown of verse numbers with no
  // text until one is chosen (step 1: references only), fetches that verse's
  // NKJV text on selection (step 2), and lets it be trimmed before saving.
  const VerseNotes = ({ book, chapter }) => {
    const usfm = USFM_CODE[book];
    const savedForChapter = Object.entries(notes).filter(([k]) => k.startsWith(`${book}::${chapter}::`));

    const [open, setOpen] = useState(false);
    const [verseRefs, setVerseRefs] = useState(null); // [{id, number}] once fetched
    const [status, setStatus] = useState("idle"); // idle | loading-refs | loading-text | ready | error
    const [errorMsg, setErrorMsg] = useState("");
    const [pickedVerse, setPickedVerse] = useState("");
    const [draftText, setDraftText] = useState("");

    const openPicker = async () => {
      setOpen(true);
      if (verseRefs || !usfm) return;
      if (!apiKey) { setStatus("error"); setErrorMsg(t("Add your API.Bible key in Settings first.", "أضف مفتاح API.Bible في الإعدادات أولاً.")); return; }
      setStatus("loading-refs");
      try {
        const bibleId = await resolveNkjvBibleId(apiKey);
        const refs = await fetchChapterVerseRefs(bibleId, apiKey, usfm, chapter);
        setVerseRefs(refs);
        setStatus("idle");
      } catch (err) {
        setStatus("error");
        setErrorMsg(
          err.message === "invalid-key" ? t("That API key was rejected — check it in Settings.", "تم رفض مفتاح API — تحقق منه في الإعدادات.")
          : err.message === "no-nkjv" ? t("Couldn't find NKJV on this API key's account.", "تعذّر العثور على NKJV ضمن هذا المفتاح.")
          : t("Couldn't reach API.Bible — try again.", "تعذّر الوصول إلى API.Bible — حاول مجددًا.")
        );
      }
    };

    const pickVerse = async (num) => {
      setPickedVerse(num);
      setDraftText("");
      if (!num) return;
      setStatus("loading-text");
      try {
        const bibleId = await resolveNkjvBibleId(apiKey);
        const ref = verseRefs.find((v) => v.number === Number(num));
        const text = await fetchVerseText(bibleId, apiKey, ref.id);
        setDraftText(text);
        setStatus("ready");
      } catch (err) {
        setStatus("error");
        setErrorMsg(t("Couldn't fetch that verse — try again.", "تعذّر جلب هذا الشاهد — حاول مجددًا."));
      }
    };

    const save = () => {
      if (!pickedVerse || !draftText.trim()) return;
      saveNote(book, chapter, pickedVerse, draftText.trim(), `${bookLabel(book)} ${chapter}:${pickedVerse}`);
      setOpen(false); setPickedVerse(""); setDraftText(""); setStatus("idle");
    };

    return (
      <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${PALETTE.inkSoft}` }}>
        {savedForChapter.length > 0 && (
          <div className="space-y-2 mb-3">
            {savedForChapter.map(([k, note]) => (
              <div key={k} className="rounded-lg p-2.5" style={{ background: "rgba(255,255,255,0.5)", border: `1px solid ${PALETTE.inkSoft}` }}>
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[11px] font-semibold" style={{ color: PALETTE.burgundy }}>{note.reference}</span>
                  <button onClick={() => deleteNote(book, chapter, k.split("::")[2])} className="rounded p-1" style={{ color: PALETTE.inkSoft }}>
                    <Trash2 size={12} />
                  </button>
                </div>
                <p className="text-sm italic" style={{ color: PALETTE.ink }}>{note.text}</p>
              </div>
            ))}
          </div>
        )}

        {!open ? (
          <button onClick={openPicker} className="text-xs flex items-center gap-1.5 rounded-full px-3 py-1.5" style={{ background: PALETTE.ink, color: PALETTE.parchment }}>
            <BookMarked size={12} /> {t("Remember a verse", "احفظ شاهدًا")}
          </button>
        ) : (
          <div className="rounded-lg p-3" style={{ background: "rgba(255,255,255,0.5)", border: `1px solid ${PALETTE.inkSoft}` }}>
            {!usfm ? (
              <p className="text-xs" style={{ color: PALETTE.inkSoft }}>{t("NKJV doesn't include this book (it's not in the 66-book Protestant canon).", "لا يتضمن NKJV هذا السفر (ليس ضمن الأسفار الـ66).")}</p>
            ) : status === "loading-refs" ? (
              <p className="text-xs" style={{ color: PALETTE.inkSoft }}>{t("Loading verse list…", "جارٍ تحميل قائمة الآيات…")}</p>
            ) : status === "error" && !verseRefs ? (
              <p className="text-xs" style={{ color: PALETTE.burgundy }}>{errorMsg}</p>
            ) : (
              <>
                <div className="flex items-center gap-2 mb-2">
                  <select
                    value={pickedVerse}
                    onChange={(e) => pickVerse(e.target.value)}
                    className="text-sm rounded-md px-2 py-1.5 outline-none"
                    style={{ background: "#fff", border: `1px solid ${PALETTE.inkSoft}`, color: PALETTE.ink }}
                  >
                    <option value="">{t("Verse #…", "رقم الآية…")}</option>
                    {(verseRefs || []).map((v) => <option key={v.id} value={v.number}>{v.number}</option>)}
                  </select>
                  {status === "loading-text" && <span className="text-xs" style={{ color: PALETTE.inkSoft }}>{t("Fetching…", "جارٍ الجلب…")}</span>}
                  {status === "error" && verseRefs && <span className="text-xs" style={{ color: PALETTE.burgundy }}>{errorMsg}</span>}
                </div>
                {pickedVerse && status === "ready" && (
                  <>
                    <p className="text-[11px] font-semibold mb-1" style={{ color: PALETTE.burgundy }}>{bookLabel(book)} {chapter}:{pickedVerse} (NKJV)</p>
                    <textarea
                      value={draftText}
                      onChange={(e) => setDraftText(e.target.value)}
                      rows={3}
                      className="w-full text-sm rounded-md px-2 py-1.5 outline-none mb-2"
                      style={{ background: "#fff", border: `1px solid ${PALETTE.inkSoft}`, color: PALETTE.ink }}
                    />
                    <p className="text-[10px] mb-2" style={{ color: PALETTE.inkSoft }}>{t("Trim it down to just the part you want to remember, if you like.", "اختصره ليقتصر على الجزء الذي تريد تذكّره، إن أردت.")}</p>
                  </>
                )}
                <div className="flex gap-2">
                  <button onClick={save} disabled={!pickedVerse || !draftText.trim()} className="text-xs rounded-full px-3 py-1.5" style={{ background: PALETTE.ink, color: PALETTE.parchment, opacity: (!pickedVerse || !draftText.trim()) ? 0.5 : 1 }}>
                    {t("Save", "حفظ")}
                  </button>
                  <button onClick={() => { setOpen(false); setPickedVerse(""); setDraftText(""); setStatus("idle"); }} className="text-xs rounded-full px-3 py-1.5" style={{ background: "transparent", color: PALETTE.inkSoft, border: `1px solid ${PALETTE.inkSoft}` }}>
                    {t("Cancel", "إلغاء")}
                  </button>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    );
  };

  const ChapterGrid = ({ book }) => {
    const cells = Array.from({ length: book.chapters }, (_, i) => i + 1);
    const tst = testamentOf(book.testament);
    return (
      <div className="flex flex-wrap gap-2">
        {cells.map((c) => {
          const entries = readings[keyFor(book.name, c)] || [];
          const isRead = entries.length > 0;
          const isReread = entries.length > 1;
          const isSelected = selected && selected.book === book.name && selected.chapter === c;
          const sortedDates = isRead ? entries.slice().sort((a, b) => (a.date < b.date ? 1 : -1)).map((e) => fmtDate(e.date)) : [];
          const tooltip = isRead
            ? (isReread ? t(`Read ${entries.length}× — ${sortedDates.join(", ")}`, `قُرئ ${entries.length} مرات — ${sortedDates.join("، ")}`) : t(`Read once — ${sortedDates[0]}`, `قُرئ مرة واحدة — ${sortedDates[0]}`))
            : t("Click to set status", "اضغط لتحديد الحالة");
          return (
            <button
              key={c}
              onClick={() => handleCellClick(book.name, c)}
              title={tooltip}
              className="lectio-cell relative rounded-xl text-xs font-semibold flex items-center justify-center"
              style={{
                width: 34, height: 34,
                background: isRead ? `linear-gradient(150deg, ${tst.color}, ${tst.colorDeep})` : "rgba(255,255,255,0.02)",
                border: `1.5px solid ${isRead ? (isReread ? PALETTE.amber : t.color) : PALETTE.inkSoft}`,
                color: PALETTE.parchment,
                opacity: isRead ? 1 : 0.55,
                boxShadow: isRead ? "0 2px 6px rgba(0,0,0,0.3)" : "none",
                outline: isSelected ? `2px solid ${PALETTE.gold}` : "none",
                outlineOffset: 1,
              }}
            >
              {c}
              {isReread && (
                <span
                  className="lectio-reread-badge absolute flex items-center justify-center text-[9px] font-bold rounded-full"
                  style={{ top: -7, right: -7, minWidth: 16, height: 16, padding: "0 3px", background: `linear-gradient(135deg, ${PALETTE.amber}, ${PALETTE.amberDeep})`, color: PALETTE.parchment, border: `1.5px solid ${PALETTE.bg}` }}
                >
                  {entries.length}
                </span>
              )}
            </button>
          );
        })}
      </div>
    );
  };

  const BooksTab = () => {
    if (booksView === "testaments") {
      return (
        <div className="lectio-fade-in">
          {currentlyReadingBooks.length > 0 && (
            <div className="mb-5">
              <h3 className="lectio-display text-lg mb-3" style={{ color: PALETTE.parchment }}>{t("Current reading", "القراءة الحالية")}</h3>
              <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(180px, 1fr))" }}>
                {currentlyReadingBooks.map(({ book: b, read, lastDate }) => {
                  const pct = Math.round((read / b.chapters) * 100);
                  const tst = testamentOf(b.testament);
                  return (
                    <button
                      key={b.name}
                      onClick={() => openBook(b)}
                      className="lectio-tile lectio-card rounded-xl p-3 text-left flex items-center gap-3"
                      style={{ background: `linear-gradient(150deg, ${PALETTE.bgSoft2}, ${PALETTE.bgSoft})`, border: `1px solid ${PALETTE.amber}` }}
                    >
                      <div className="rounded-lg p-2 flex-shrink-0" style={{ background: PALETTE.wood }}>
                        <BookMarked size={16} color={PALETTE.amber} />
                      </div>
                      <div className="min-w-0 flex-1">
                        <div className="lectio-display text-sm truncate" style={{ color: PALETTE.parchment }}>{bookLabel(b.name)}</div>
                        <div className="w-full h-1.5 rounded-full overflow-hidden my-1" style={{ background: PALETTE.wood }}>
                          <div style={{ width: `${pct}%`, height: "100%", background: `linear-gradient(90deg, ${tst.colorDeep}, ${tst.color})` }} />
                        </div>
                        <div className="flex flex-col gap-0.5">
                          <span className="text-[10px]" style={{ color: PALETTE.amber }}>{read}/{b.chapters} {t("chapters", "إصحاحًا")}</span>
                          {lastDate && <span className="text-[10px] truncate" style={{ color: PALETTE.muted }}>{t(`Last read ${fmtDate(lastDate)}`, `آخر قراءة ${fmtDate(lastDate)}`)}</span>}
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {testamentProgress.map((tst) => (
              <button
                key={tst.key}
                onClick={() => { setBooksTestament(tst.key); setBooksView("grid"); }}
                className="lectio-tile lectio-card rounded-2xl p-6 text-left"
                style={{ background: `linear-gradient(150deg, ${PALETTE.bgSoft2}, ${PALETTE.bgSoft})`, border: `1px solid ${PALETTE.wood}` }}
              >
                <div className="flex items-center justify-between mb-1">
                  <h2 className="lectio-display text-2xl" style={{ color: PALETTE.parchment }}>{tst.label}</h2>
                  {tst.bookPasses > tst.booksDoneOnce && <RereadChip count={tst.bookPasses - tst.booksDoneOnce} />}
                </div>
                <p className="text-xs mb-3" style={{ color: PALETTE.muted }}>
                  {t(
                    `${BOOKS.filter((b) => b.testament === tst.key).length} books · ${tst.read}/${tst.total} chapters · ${tst.totalReads} total reading${tst.totalReads === 1 ? "" : "s"}`,
                    `${BOOKS.filter((b) => b.testament === tst.key).length} سفرًا · ${tst.read}/${tst.total} إصحاحًا · ${tst.totalReads} قراءة إجمالًا`
                  )}
                </p>
                <div className="w-full h-2 rounded-full overflow-hidden" style={{ background: PALETTE.wood }}>
                  <div style={{ width: `${tst.pct}%`, height: "100%", background: `linear-gradient(90deg, ${tst.colorDeep}, ${tst.color})` }} />
                </div>
                <span className="text-xs mt-2 inline-block" style={{ color: tst.color }}>{tst.pct}% {t("read →", "مقروء ←")}</span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    if (booksView === "grid") {
      const tst = testamentOf(booksTestament);
      const booksIn = BOOKS.filter((b) => b.testament === booksTestament);
      return (
        <div className="lectio-fade-in">
          <button onClick={() => setBooksView("testaments")} className="flex items-center gap-1 text-sm mb-3" style={{ color: PALETTE.gold }}>
            <ChevronLeft size={15} /> {t("All testaments", "كل العهود")}
          </button>
          <h2 className="lectio-display text-xl mb-3" style={{ color: PALETTE.parchment }}>{testamentLabel(tst.key)}</h2>
          <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))" }}>
            {booksIn.map((b) => {
              const read = bookProgress[b.name] || 0;
              const pct = Math.round((read / b.chapters) * 100);
              const done = read >= b.chapters;
              const inProgress = read > 0 && !done;
              const completions = bookCompletions[b.name] || 0;
              return (
                <button key={b.name} onClick={() => openBook(b)} className="lectio-tile lectio-card rounded-xl p-3 text-left" style={{ background: `linear-gradient(150deg, ${PALETTE.bgSoft2}, ${PALETTE.bgSoft})`, border: `1px solid ${done ? PALETTE.gold : inProgress ? PALETTE.amber : PALETTE.wood}` }}>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] font-semibold rounded px-1.5 py-0.5" style={{ background: PALETTE.parchmentSoft, color: PALETTE.ink }}>{b.abbr}</span>
                    <div className="flex items-center gap-1">
                      {completions >= 2 && <RereadChip count={completions} />}
                      {done && <CheckCircle2 size={14} color={PALETTE.gold} />}
                      {inProgress && <BookMarked size={14} color={PALETTE.amber} />}
                    </div>
                  </div>
                  <div className="lectio-display text-sm mb-2" style={{ color: PALETTE.parchment, lineHeight: 1.15 }}>{bookLabel(b.name)}</div>
                  <div className="w-full h-1.5 rounded-full overflow-hidden mb-1" style={{ background: PALETTE.wood }}>
                    <div style={{ width: `${pct}%`, height: "100%", background: `linear-gradient(90deg, ${tst.colorDeep}, ${tst.color})` }} />
                  </div>
                  <span className="text-[10px]" style={{ color: inProgress ? PALETTE.amber : PALETTE.muted }}>{read}/{b.chapters} {t("chapters", "إصحاحًا")}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    const book = BOOK_BY_NAME[booksSelectedBook];
    if (!book) return null;
    const read = bookProgress[book.name] || 0;
    const completions = bookCompletions[book.name] || 0;
    return (
      <div className="lectio-fade-in">
        <div className="flex items-center gap-1 text-sm mb-3" style={{ color: PALETTE.gold }}>
          <button onClick={() => { setBooksView("testaments"); setSelected(null); }} className="flex items-center gap-1">{testamentLabel(book.testament)}</button>
          <ChevronRight size={13} color={PALETTE.muted} />
          <button onClick={() => { setBooksView("grid"); setSelected(null); }}>{t("All books", "كل الأسفار")}</button>
        </div>
        <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
          <h2 className="lectio-display text-2xl" style={{ color: PALETTE.parchment }}>{bookLabel(book.name)}</h2>
          <span className="text-sm flex items-center gap-2" style={{ color: PALETTE.muted }}>
            {read}/{book.chapters} {t("chapters read", "إصحاحًا مقروءًا")}
            {completions >= 2 && <RereadChip count={completions} />}
          </span>
        </div>
        {selected && selected.book === book.name && <DetailPanel />}
        <Card>
          <ChapterGrid book={book} />
        </Card>
      </div>
    );
  };

  const ProfilePicker = () => {
    const [managing, setManaging] = useState(false);
    const [addingName, setAddingName] = useState(null); // string while the "new profile" input is open

    const submitNewProfile = () => {
      const name = (addingName || "").trim();
      if (!name) { setAddingName(null); return; }
      addProfile(name);
      setAddingName(null);
    };

    return (
      <div className="lectio-root flex items-center justify-center" style={{ background: PALETTE.bg, minHeight: "100vh", padding: 20 }}>
        {fontImport}
        <div style={{ maxWidth: 760, width: "100%" }}>
          <div className="flex items-center justify-center gap-3 mb-2">
            <BookMarked size={30} color={PALETTE.gold} />
            <h1 className="lectio-display text-4xl" style={{ color: PALETTE.parchment }}>Lectio</h1>
          </div>
          <p className="text-center text-lg mb-10" style={{ color: PALETTE.muted }}>{t("Who's reading?", "من الذي يقرأ؟")}</p>
          <div className="flex flex-wrap items-start justify-center gap-6">
            {profiles.map((p) => (
              <div key={p.id} className="flex flex-col items-center gap-2" style={{ width: 110 }}>
                <button
                  onClick={() => (managing ? null : selectProfile(p.id))}
                  className="lectio-tile rounded-2xl flex items-center justify-center relative"
                  style={{ width: 96, height: 96, background: `linear-gradient(150deg, ${p.color}, ${PALETTE.bgSoft2})`, border: `2px solid ${PALETTE.wood}` }}
                >
                  <span className="lectio-display text-3xl" style={{ color: PALETTE.parchment }}>{p.name.trim().charAt(0).toUpperCase()}</span>
                  {managing && (
                    <span
                      role="button"
                      onClick={(e) => { e.stopPropagation(); if (window.confirm(t(`Delete "${p.name}"? This removes all of their tracked reading.`, `حذف "${p.name}"؟ سيؤدي هذا لحذف كل قراءاته المسجّلة.`))) deleteProfile(p.id); }}
                      className="absolute rounded-full flex items-center justify-center"
                      style={{ top: -8, right: -8, width: 26, height: 26, background: PALETTE.burgundy, color: PALETTE.parchment, border: `1.5px solid ${PALETTE.bg}` }}
                    >
                      <Trash2 size={13} />
                    </span>
                  )}
                </button>
                {managing ? (
                  <input
                    defaultValue={p.name}
                    onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== p.name) renameProfile(p.id, v); }}
                    className="text-sm text-center rounded-md px-2 py-1 outline-none w-full"
                    style={{ background: PALETTE.bgSoft2, border: `1px solid ${PALETTE.goldSoft}`, color: PALETTE.parchment }}
                  />
                ) : (
                  <span className="text-sm truncate w-full text-center" style={{ color: PALETTE.parchment }}>{p.name}</span>
                )}
              </div>
            ))}

            <div className="flex flex-col items-center gap-2" style={{ width: 110 }}>
              {addingName !== null ? (
                <div className="flex flex-col items-center gap-2 w-full">
                  <div className="rounded-2xl flex items-center justify-center" style={{ width: 96, height: 96, border: `2px dashed ${PALETTE.goldSoft}` }}>
                    <BookMarked size={28} color={PALETTE.goldSoft} />
                  </div>
                  <input
                    autoFocus
                    value={addingName}
                    onChange={(e) => setAddingName(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") submitNewProfile(); if (e.key === "Escape") setAddingName(null); }}
                    onBlur={submitNewProfile}
                    placeholder={t("Name", "الاسم")}
                    className="text-sm text-center rounded-md px-2 py-1 outline-none w-full"
                    style={{ background: PALETTE.bgSoft2, border: `1px solid ${PALETTE.goldSoft}`, color: PALETTE.parchment }}
                  />
                </div>
              ) : (
                <button onClick={() => setAddingName("")} className="lectio-tile rounded-2xl flex items-center justify-center" style={{ width: 96, height: 96, border: `2px dashed ${PALETTE.wood}` }}>
                  <span className="text-4xl" style={{ color: PALETTE.muted, lineHeight: 1 }}>+</span>
                </button>
              )}
              <span className="text-sm" style={{ color: PALETTE.muted }}>{addingName !== null ? "" : t("Add Profile", "إضافة ملف")}</span>
            </div>
          </div>

          {profiles.length > 0 && (
            <div className="flex justify-center mt-10">
              <button
                onClick={() => setManaging((m) => !m)}
                className="text-xs rounded-md px-4 py-2 uppercase tracking-wider"
                style={{ background: "transparent", border: `1px solid ${PALETTE.wood}`, color: PALETTE.muted }}
              >
                {managing ? t("Done", "تم") : t("Manage Profiles", "إدارة الملفات")}
              </button>
            </div>
          )}
          <p className="text-center text-[11px] mt-6" style={{ color: PALETTE.wood }}>
            {t("No passwords — anyone here can view or edit any profile's progress.", "لا كلمات مرور — يمكن لأي شخص هنا عرض أو تعديل تقدم أي ملف.")}
          </p>
        </div>
      </div>
    );
  };

  if (!loaded) {
    return (
      <div className="lectio-root flex items-center justify-center p-10" style={{ background: PALETTE.bg, minHeight: 300 }}>
        {fontImport}
        <span className="lectio-display text-lg" style={{ color: PALETTE.parchment }}>{t("Opening the shelf…", "جارٍ فتح الرف…")}</span>
      </div>
    );
  }

  if (!activeProfileId) {
    return <ProfilePicker />;
  }
  const activeProfile = profiles.find((p) => p.id === activeProfileId) || { name: "?", color: PALETTE.gold };

  return (
    <div className="lectio-root" style={{ background: `radial-gradient(circle at 20% 0%, ${PALETTE.bgSoft2}, ${PALETTE.bg} 60%)`, minHeight: "100%", padding: 20 }}>
      {fontImport}
      <div style={{ maxWidth: 920, margin: "0 auto" }}>
        <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
          <button
            onClick={() => { setActiveTab("books"); setBooksView("testaments"); setSelected(null); setExpandedStat(null); }}
            className="flex items-center gap-3 text-left"
            title={t("Go to Books", "الذهاب إلى الأسفار")}
          >
            <BookMarked size={26} color={PALETTE.gold} />
            <div>
              <h1 className="lectio-display text-3xl leading-none" style={{ color: PALETTE.parchment }}>{t("Lectio", "لِكتيو")}</h1>
              <p className="text-[11px] italic mt-1" style={{ color: PALETTE.goldSoft }}>Ἰησοῦς Χριστός, Υἱὸς Θεοῦ, Σωτήρ</p>
            </div>
          </button>
          <div className="flex items-center gap-3 flex-wrap">
            <div className="flex rounded-full overflow-hidden" style={{ border: `1px solid ${PALETTE.wood}` }}>
              {[{ v: "dashboard", l: t("Dashboard", "لوحة التحكم") }, { v: "books", l: t("Books", "الأسفار") }].map((tb) => (
                <button key={tb.v} onClick={() => setActiveTab(tb.v)} className="lectio-pill px-4 py-1.5 text-sm" style={{ background: activeTab === tb.v ? PALETTE.gold : "transparent", color: activeTab === tb.v ? PALETTE.ink : PALETTE.muted, fontWeight: activeTab === tb.v ? 600 : 400 }}>
                  {tb.l}
                </button>
              ))}
            </div>
            <button
              onClick={switchProfile}
              title={t("Switch profile", "تبديل الملف")}
              className="flex items-center gap-2 rounded-full pl-1 pr-3 py-1"
              style={{ border: `1px solid ${PALETTE.wood}` }}
            >
              <span
                className="rounded-full flex items-center justify-center lectio-display"
                style={{ width: 26, height: 26, background: `linear-gradient(150deg, ${activeProfile.color}, ${PALETTE.bgSoft2})`, color: PALETTE.parchment, fontSize: 13 }}
              >
                {activeProfile.name.trim().charAt(0).toUpperCase()}
              </span>
              <span className="text-xs" style={{ color: PALETTE.muted }}>{activeProfile.name}</span>
            </button>
          </div>
        </div>

        {activeTab === "dashboard" && (
          <div className="space-y-5 lectio-fade-in">
            <div className="flex flex-wrap items-center gap-3 rounded-xl p-3" style={{ background: PALETTE.bgSoft, border: `1px solid ${PALETTE.wood}` }}>
              <span className="text-[11px] uppercase tracking-wider" style={{ color: PALETTE.muted }}>{t("Testament", "العهد")}</span>
              <PillGroup value={filterTestament} onChange={setFilterTestament} options={[{ value: "all", label: t("All", "الكل") }, { value: "ot", label: t("Old", "قديم") }, { value: "nt", label: t("New", "جديد") }]} />
            </div>

            <Card className="flex flex-wrap items-center gap-6">
              <div className="relative flex items-center justify-center">
                <Ring pct={scopePct} />
                <div className="absolute flex flex-col items-center">
                  <span className="lectio-display text-2xl" style={{ color: PALETTE.parchment }}>{scopePct}%</span>
                  <span className="text-[10px]" style={{ color: PALETTE.muted }}>{filterTestament === "all" ? "of canon" : testamentOf(filterTestament).label}</span>
                </div>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 flex-1 min-w-[280px]">
                <StatCard icon={<CheckCircle2 size={16} color={PALETTE.gold} />} label={t("Chapters read", "الإصحاحات المقروءة")} value={`${scopeRead} / ${scopeTotal}`} active={expandedStat === "chapters"} onClick={() => setExpandedStat((s) => (s === "chapters" ? null : "chapters"))} />
                <StatCard icon={<Library size={16} color={PALETTE.gold} />} label={t("Books completed", "الأسفار المكتملة")} value={`${scopeBooksCompleted} / ${scopeBooks.length}`} active={expandedStat === "books"} onClick={() => setExpandedStat((s) => (s === "books" ? null : "books"))} />
                <StatCard icon={<ListChecks size={16} color={PALETTE.gold} />} label={t("Verses read (est.)", "الآيات المقروءة (تقريبًا)")} value={scopeVerses.toLocaleString()} sub={t(`of ~${scopeVersesTotal.toLocaleString()}`, `من أصل ~${scopeVersesTotal.toLocaleString()}`)} active={expandedStat === "verses"} onClick={() => setExpandedStat((s) => (s === "verses" ? null : "verses"))} />
                <StatCard icon={<Repeat size={16} color={PALETTE.amber} />} label={t("Re-reads", "إعادة القراءة")} value={rereadBooksDetail.length} sub={scopedRereadAchievements.length ? t(`🏆 ${scopedRereadAchievements.map((tst) => tst.label).join(" & ")} fully re-read`, `🏆 أُعيد قراءة ${scopedRereadAchievements.map((tst) => testamentLabel(tst.key)).join(" و")} بالكامل`) : undefined} active={expandedStat === "rereads"} onClick={() => setExpandedStat((s) => (s === "rereads" ? null : "rereads"))} />
                <StatCard icon={<Flame size={16} color={PALETTE.gold} />} label={t("Current streak", "السلسلة الحالية")} value={t(`${currentStreak}d`, `${currentStreak} يومًا`)} active={expandedStat === "current-streak"} onClick={() => setExpandedStat((s) => (s === "current-streak" ? null : "current-streak"))} />
                <StatCard icon={<Flame size={16} color={PALETTE.goldSoft} />} label={t("Longest streak", "أطول سلسلة")} value={t(`${longestStreak}d`, `${longestStreak} يومًا`)} active={expandedStat === "longest-streak"} onClick={() => setExpandedStat((s) => (s === "longest-streak" ? null : "longest-streak"))} />
              </div>
              <StatDetailPanel />
            </Card>

            <PaceCard />
            <MilestoneStrip />
            <RereadCard />

            <Card>
              <div className="flex items-center justify-between flex-wrap gap-3 mb-3">
                <h3 className="lectio-display text-lg" style={{ color: PALETTE.parchment }}>{t("Reading history", "سجل القراءة")}</h3>
                <div className="flex items-center gap-2 flex-wrap">
                  <PillGroup value={historyMetric} onChange={setHistoryMetric} options={[{ value: "books", label: t("Books", "الأسفار") }, { value: "chapters", label: t("Chapters", "الإصحاحات") }]} />
                  <PillGroup value={historyGranularity} onChange={setHistoryGranularity} options={[{ value: "year", label: t("Year", "سنة") }, { value: "month", label: t("Month", "شهر") }]} />
                </div>
              </div>
              {historyData.length > 0 ? (
                <>
                  <ResponsiveContainer width="100%" height={200}>
                    <BarChart data={historyData}>
                      <CartesianGrid stroke={PALETTE.wood} vertical={false} />
                      <XAxis dataKey="label" tick={{ fill: PALETTE.muted, fontSize: 11 }} axisLine={{ stroke: PALETTE.wood }} tickLine={false} minTickGap={20} />
                      <YAxis tick={{ fill: PALETTE.muted, fontSize: 11 }} axisLine={false} tickLine={false} width={30} allowDecimals={false} />
                      <Tooltip content={<HistoryTooltip />} cursor={{ fill: "rgba(212,175,55,0.08)" }} />
                      <Bar dataKey="count" radius={[4, 4, 0, 0]} fill={PALETTE.gold} maxBarSize={40} />
                    </BarChart>
                  </ResponsiveContainer>
                  <div className="flex flex-wrap gap-2 mt-3">
                    {historyData.map((d) => (
                      <span key={d.period} className="text-[11px] rounded-full px-2.5 py-1" style={{ background: PALETTE.wood, color: PALETTE.parchment }}>
                        {d.label}: <span style={{ color: PALETTE.gold, fontWeight: 600 }}>{d.count}</span>
                      </span>
                    ))}
                  </div>
                </>
              ) : (
                <div className="text-sm py-8 text-center" style={{ color: PALETTE.muted }}>
                  {historyMetric === "books" ? t("Finish a book to see it show up here.", "أنهِ سفرًا ليظهر هنا.") : t("Mark a few chapters read to see your history take shape.", "علّم بعض الإصحاحات كمقروءة ليتشكل سجلك.")}
                </div>
              )}
              <p className="text-[11px] mt-2" style={{ color: PALETTE.muted }}>
                {historyMetric === "books" ? t("A book is counted the moment its last remaining chapter is first read.", "يُحتسب السفر بمجرد قراءة آخر إصحاح متبقٍ منه لأول مرة.") : t("Counts each chapter once, in the period it was first read — re-reads aren't counted again.", "يُحتسب كل إصحاح مرة واحدة، في الفترة التي قُرئ فيها لأول مرة — لا تُحتسب إعادة القراءة مجددًا.")}
              </p>
            </Card>

            <Card>
              <h3 className="lectio-display text-lg mb-3" style={{ color: PALETTE.parchment }}>{t("Progress by testament", "التقدم حسب العهد")}</h3>
              <ResponsiveContainer width="100%" height={140}>
                <BarChart data={testamentProgress} layout="vertical" margin={{ left: 10, right: 20 }}>
                  <CartesianGrid stroke={PALETTE.wood} horizontal={false} />
                  <XAxis type="number" domain={[0, 100]} tick={{ fill: PALETTE.muted, fontSize: 11 }} axisLine={{ stroke: PALETTE.wood }} tickLine={false} unit="%" />
                  <YAxis type="category" dataKey="label" tick={{ fill: PALETTE.muted, fontSize: 12 }} axisLine={false} tickLine={false} width={110} />
                  <Tooltip contentStyle={{ background: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}`, borderRadius: 8, fontSize: 12 }} labelStyle={{ color: PALETTE.ink, fontWeight: 600 }} formatter={(v, n, p) => [t(`${p.payload.read}/${p.payload.total} chapters · ${p.payload.totalReads} total readings`, `${p.payload.read}/${p.payload.total} إصحاحًا · ${p.payload.totalReads} قراءة إجمالًا`), t("Read", "مقروء")]} />
                  <Bar dataKey="pct" radius={[0, 4, 4, 0]} barSize={28}>
                    {testamentProgress.map((tst) => <RCell key={tst.key} fill={tst.color} opacity={filterTestament === "all" || filterTestament === tst.key ? 1 : 0.3} />)}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
              <div className="flex flex-wrap gap-4 mt-2">
                {testamentProgress.map((tst) => (
                  <div key={tst.key} className="text-[11px]" style={{ color: PALETTE.muted }}>
                    <span style={{ color: PALETTE.parchment, fontWeight: 600 }}>{tst.label}:</span> {tst.read}/{tst.total} {t("chapters", "إصحاحًا")}
                    {tst.bookPasses > tst.booksDoneOnce && (
                      <span style={{ color: PALETTE.amber }}> · {t(`${tst.bookPasses - tst.booksDoneOnce} book${tst.bookPasses - tst.booksDoneOnce === 1 ? "" : "s"} re-read`, `أُعيدت قراءة ${tst.bookPasses - tst.booksDoneOnce} سفرًا`)}</span>
                    )}
                  </div>
                ))}
              </div>
            </Card>

            <Shelf />

            {recent.length > 0 && (
              <Card>
                <h3 className="lectio-display text-lg mb-3" style={{ color: PALETTE.parchment }}>{t("Recent readings", "القراءات الأخيرة")}</h3>
                <div className="space-y-1">
                  {recent.map((r, i) => (
                    <button key={`${r.book}-${r.chapter}-${r.date}-${i}`} onClick={() => goToChapter(r.book, r.chapter)} className="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm" style={{ background: PALETTE.wood, color: PALETTE.parchment }}>
                      <span className="flex items-center gap-2">
                        {bookLabel(r.book)} {r.chapter}
                        <RereadChip count={r.timesRead} />
                      </span>
                      <span style={{ color: PALETTE.gold }}>{fmtDate(r.date)}</span>
                    </button>
                  ))}
                </div>
              </Card>
            )}
          </div>
        )}

        {activeTab === "books" && <BooksTab />}

        <div className="flex flex-col items-center gap-2 pt-6 pb-2">
          <div className="flex items-center gap-2">
            <button
              onClick={exportData}
              className="text-xs rounded-md px-3 py-1.5 flex items-center gap-1.5"
              style={{ background: PALETTE.wood, color: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}` }}
            >
              <Download size={13} /> {t("Backup data", "نسخ احتياطي للبيانات")}
            </button>
            <button
              onClick={() => importInputRef.current && importInputRef.current.click()}
              className="text-xs rounded-md px-3 py-1.5 flex items-center gap-1.5"
              style={{ background: PALETTE.wood, color: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}` }}
            >
              <Upload size={13} /> {t("Restore backup", "استعادة النسخة الاحتياطية")}
            </button>
            <input
              ref={importInputRef}
              type="file"
              accept="application/json"
              className="hidden"
              onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importData(f); e.target.value = ""; }}
            />
            <button
              onClick={() => setShowKeySettings(true)}
              className="text-xs rounded-md px-3 py-1.5 flex items-center gap-1.5"
              style={{ background: PALETTE.wood, color: PALETTE.parchment, border: `1px solid ${PALETTE.goldSoft}` }}
            >
              <Lock size={13} /> {t("NKJV API Key", "مفتاح NKJV")}
            </button>
          </div>
          <div className="text-center text-[11px]" style={{ color: PALETTE.wood }}>
            {saveState === "saving" ? t("Saving…", "جارٍ الحفظ…") : saveState === "error" ? t("Couldn't save — your browser may be blocking local storage.", "تعذّر الحفظ — قد يكون متصفحك يمنع التخزين المحلي.") : t("Your reading log is saved on this device. Back it up regularly so you never lose it.", "سجل قراءتك محفوظ على هذا الجهاز. اعمل نسخة احتياطية بانتظام حتى لا تفقد بياناتك.")}
          </div>
        </div>

        {showKeySettings && (
          <div className="fixed inset-0 flex items-center justify-center p-4 z-50" style={{ background: "rgba(0,0,0,0.6)" }} onClick={() => setShowKeySettings(false)}>
            <div className="rounded-2xl p-5 max-w-sm w-full" style={{ background: PALETTE.bgSoft, border: `1px solid ${PALETTE.goldSoft}` }} onClick={(e) => e.stopPropagation()}>
              <h3 className="lectio-display text-lg mb-2" style={{ color: PALETTE.parchment }}>{t("API.Bible Key", "مفتاح API.Bible")}</h3>
              <p className="text-xs mb-3" style={{ color: PALETTE.muted }}>
                {t("Used only to fetch NKJV verse text when you tap \"Remember a verse.\" Get a free key at ", "يُستخدم فقط لجلب نص NKJV عند الضغط على \"احفظ شاهدًا\". احصل على مفتاح مجاني من ")}
                <a href="https://scripture.api.bible" target="_blank" rel="noreferrer" style={{ color: PALETTE.gold }}>scripture.api.bible</a>.
                {" "}{t("Stored only in this browser — never included in backup files.", "يُخزَّن في هذا المتصفح فقط — لا يُدرج أبدًا في ملفات النسخ الاحتياطي.")}
              </p>
              <input
                type="password"
                defaultValue={apiKey}
                onBlur={(e) => saveApiKey(e.target.value.trim())}
                placeholder={t("Paste your API key", "الصق مفتاح API الخاص بك")}
                className="w-full text-sm rounded-md px-3 py-2 outline-none mb-3"
                style={{ background: PALETTE.bgSoft2, border: `1px solid ${PALETTE.wood}`, color: PALETTE.parchment }}
              />
              <button onClick={() => setShowKeySettings(false)} className="text-xs rounded-full px-4 py-2 w-full" style={{ background: PALETTE.gold, color: PALETTE.ink }}>
                {t("Done", "تم")}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<LectioTracker />);

</script>
</body>
</html>
